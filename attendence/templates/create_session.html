{% extends 'base.html' %}

{% block title %}Create Attendance Session{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Start New Class Session</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Type Subject Name</label>
                        <input type="text" name="subject_name" class="form-control" placeholder="e.g. Computer Science" required>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-6">
                            <label class="form-label fw-bold">Start Time</label>
                            <input type="time" name="start_time" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">End Time</label>
                            <input type="time" name="end_time" class="form-control" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Broadcast Session to Students</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
