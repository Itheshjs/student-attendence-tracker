<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .portal-btn {
            transition: transform 0.2s;
        }
        .portal-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="welcome-card p-5 text-center">
                <h1 class="display-4 fw-bold mb-4 text-primary">Attendance System</h1>
                <p class="lead mb-5 text-muted">Please select your portal to continue.</p>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card h-100 border-primary portal-btn">
                            <div class="card-body">
                                <h3>🎓 Student</h3>
                                <p class="text-muted">Mark attendance & view records</p>
                                <a href="{% url 'login_student' %}" class="btn btn-primary w-100 mt-2">Login as Student</a>
                                <a href="{% url 'signup_student' %}" class="btn btn-outline-primary w-100 mt-2">Sign Up</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100 border-success portal-btn">
                            <div class="card-body">
                                <h3>👨‍🏫 Lecturer</h3>
                                <p class="text-muted">Manage classes & view reports</p>
                                <a href="{% url 'login_teacher' %}" class="btn btn-success w-100 mt-2">Login as Lecturer</a>
                                <a href="{% url 'signup_teacher' %}" class="btn btn-outline-success w-100 mt-2">Sign Up</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
